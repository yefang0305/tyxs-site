<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周易六十四卦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2a1f0f;
  --ink-deep: #1a1206;
  --ink-light: #5c4a32;
  --paper: #f5efe0;
  --paper-dark: #eae2cf;
  --paper-deep: #d9ccad;
  --wood: #8b6914;
  --wood-light: #c9a227;
  --seal: #9b2c2c;
  --border-wood: rgba(100, 70, 20, 0.35);
  --shadow-soft: 0 4px 20px rgba(40, 25, 10, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
  background-color: var(--paper);
}

/* ── HEADER ── */
.site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px;
  border-bottom: 2px solid var(--border-wood);
  background: linear-gradient(to bottom, var(--paper-dark), var(--paper));
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 8px rgba(40, 25, 10, 0.1);
}
.site-title {
  font-size: 22px; font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--ink-deep);
  text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
}
.site-title span {
  color: var(--wood);
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0.4em;
  display: block;
  margin-top: 2px;
}
.selector-wrap { position: relative; }
.gua-select {
  appearance: none;
  background: var(--ink-deep);
  color: var(--paper);
  border: 2px solid var(--wood);
  padding: 10px 44px 10px 18px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  letter-spacing: 0.1em;
  border-radius: 4px;
  cursor: pointer;
  min-width: 260px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}
.selector-wrap::after {
  content: '▾';
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--wood-light);
  pointer-events: none;
  font-size: 14px;
}

/* ── MAIN CONTAINER ── */
.main {
  max-width: 960px;
  margin: 0 auto;
  padding: 36px 20px 100px;
}

/* ── HERO CARD ── */
.gua-hero {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 0;
  border-radius: 0;
  background: var(--paper);
  border: 3px solid var(--border-wood);
  position: relative;
  overflow: visible;
  margin-bottom: 28px;
  box-shadow: var(--shadow-soft), 0 0 0 6px var(--paper), 0 0 0 9px var(--border-wood);
}

/* 仿古边框装饰 */
.gua-hero::before {
  content: '';
  position: absolute;
  top: -12px; left: -12px; right: -12px; bottom: -12px;
  border: 1px solid var(--border-wood);
  pointer-events: none;
  z-index: -1;
}

/* 角花装饰 */
.gua-hero::after {
  content: '';
  position: absolute;
  top: 8px; left: 8px; right: 8px; bottom: 8px;
  border: 1px solid rgba(100, 70, 20, 0.2);
  pointer-events: none;
}

/* 四角装饰图案 */
.corner-decoration {
  position: absolute;
  width: 40px;
  height: 40px;
  border: 2px solid var(--border-wood);
  z-index: 5;
}
.corner-decoration.top-left { top: 16px; left: 16px; border-right: none; border-bottom: none; }
.corner-decoration.top-right { top: 16px; right: 16px; border-left: none; border-bottom: none; }
.corner-decoration.bottom-left { bottom: 16px; left: 16px; border-right: none; border-top: none; }
.corner-decoration.bottom-right { bottom: 16px; right: 16px; border-left: none; border-top: none; }

/* ── 左侧：卦画区 ── */
.hex-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 36px 20px;
  background: linear-gradient(to right, var(--paper-dark), var(--paper));
  border-right: 2px solid var(--border-wood);
  position: relative;
  z-index: 2;
}

.hex-panel::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(to bottom, transparent, var(--border-wood), transparent);
}

.hex-lines {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.hex-line-row {
  display: flex;
  flex-direction: row;
  align-items: center;
  cursor: pointer;
  position: relative;
  transition: transform .15s;
}
.hex-line-row:hover { transform: translateX(4px); }
.hex-line-row:hover .hex-line-bar { opacity: 0.9; }


/* 卦线容器 */
.hex-line-bar {
  width: 156px;
  height: 26px;
  position: relative;
  transition: opacity .15s;
  flex-shrink: 0;
}
.hex-line-bar:hover { opacity: 0.9; }

/* 阴爻分成两段 */
.hex-line-bar.yin {
  display: flex;
  gap: 18px;
}


.trig-sep {
  width: 150px;
  margin: 10px 0;
  border: none;
  border-top: 2px solid var(--border-wood);
  position: relative;
}
.trig-sep::before,
.trig-sep::after {
  content: '◆';
  position: absolute;
  top: -8px;
  font-size: 10px;
  color: var(--wood);
}
.trig-sep::before { left: 0; }
.trig-sep::after { right: 0; }

.hex-panel-num {
  margin-top: 24px;
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 0.3em;
  font-weight: 500;
  padding: 4px 16px;
  border: 1px solid var(--border-wood);
  border-radius: 2px;
  background: rgba(255,255,255,0.4);
}

/* ── 右侧：内容区 ── */
.gua-meta-panel {
  padding: 32px 36px 28px 32px;
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--paper);
}

/* 卦名大字水印 - 狂野草书风格 */
.gua-watermark {
  position: absolute;
  top: 0px;
  left: 290px;
  font-size: 180px;
  font-weight: 400;
  color: rgba(100, 70, 20, 0.11);
  font-family: 'Liu Jian Mao Cao', 'Ma Shan Zheng', cursive;
  pointer-events: none;
  z-index: 0;
  line-height: 1;
  text-shadow: none;
  transform: rotate(-6deg) skewX(-3deg);
  letter-spacing: -0.1em;
}

.meta-top-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  position: relative;
  z-index: 1;
}

.gua-name-section {
  display: flex;
  align-items: flex-end;
  gap: 16px;
}

.gua-main-name {
  font-size: 72px;
  font-weight: 900;
  color: var(--ink-deep);
  line-height: 1;
  letter-spacing: 0.1em;
  text-shadow:
    2px 2px 0 rgba(255,255,255,0.8),
    -1px -1px 0 rgba(0,0,0,0.05);
}

.gua-name-sub {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-bottom: 8px;
}

.gua-pinyin {
  font-size: 14px;
  color: var(--wood);
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.gua-fullname {
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.1em;
}

/* 内外卦卡片 - 仿古 style */
.trigram-cards {
  display: flex;
  gap: 12px;
  margin-top: 8px;
}

.trig-mini-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(234,226,207,0.6));
  border: 2px solid var(--border-wood);
  border-radius: 3px;
  padding: 8px 14px;
  text-align: center;
  min-width: 88px;
  position: relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
}

.trig-mini-card::before {
  content: '';
  position: absolute;
  top: 4px; left: 4px; right: 4px; bottom: 4px;
  border: 1px solid rgba(100, 70, 20, 0.15);
  pointer-events: none;
}

.trig-mini-role {
  font-size: 10px;
  color: var(--wood);
  letter-spacing: 0.2em;
  font-weight: 600;
  margin-bottom: 2px;
}

.trig-mini-name {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink-deep);
  line-height: 1.1;
}

.trig-mini-attr {
  font-size: 11px;
  color: var(--ink-light);
  margin-top: 2px;
}

/* 标签 - 竹简风格 */
.gua-tags {
  display: flex;
  gap: 14px;
  margin: 22px 0;
  position: relative;
  z-index: 1;
  padding: 12px 0;
  border-top: 1px solid var(--border-wood);
  border-bottom: 1px solid var(--border-wood);
}

.tag {
  font-size: 13px;
  padding: 6px 16px;
  border-radius: 2px;
  border: 1px solid var(--border-wood);
  background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(234,226,207,0.5));
  font-family: 'Noto Serif SC', serif;
  letter-spacing: 0.1em;
  color: var(--ink);
  font-weight: 500;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
}

.tag b {
  color: var(--wood);
  font-weight: 700;
  margin-right: 4px;
}

/* 原文区块 - 古籍 style */
.orig-blocks {
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.orig-block {
  background: linear-gradient(to right, rgba(255,255,255,0.55), rgba(255,255,255,0.35));
  border: 1px solid var(--border-wood);
  border-left: 4px solid var(--wood);
  border-radius: 0 3px 3px 0;
  transition: all 0.25s;
  overflow: hidden;
  cursor: pointer;
  position: relative;
}

.orig-block::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 28px,
      rgba(100, 70, 20, 0.06) 28px,
      rgba(100, 70, 20, 0.06) 29px
    );
  pointer-events: none;
  opacity: 0.5;
}

.orig-block:hover {
  background: rgba(255,255,255,0.8);
  border-color: var(--wood);
  transform: translateX(4px);
}

.orig-block.active {
  border-color: var(--wood);
  border-left-color: var(--seal);
  background: rgba(255,250,235,0.9);
}

.orig-block-header {
  display: grid;
  grid-template-columns: 36px 1fr 18px;
  align-items: baseline;
  gap: 0;
  padding: 12px 16px 10px;
  position: relative;
  z-index: 1;
}

.orig-block-tag {
  font-size: 11px;
  font-family: 'Noto Serif SC', serif;
  letter-spacing: 0.2em;
  color: var(--wood);
  font-weight: 700;
  padding-top: 2px;
}

.orig-block-text {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-deep);
  line-height: 1.8;
  letter-spacing: 0.08em;
}

.orig-block-chevron {
  font-size: 12px;
  color: var(--wood);
  transition: transform .2s;
  text-align: right;
  padding-top: 3px;
}

.orig-block.active .orig-block-chevron {
  transform: rotate(180deg);
  color: var(--seal);
}

/* ── ANALYSIS DRAWER ── */
.analysis-drawer {
  background: var(--paper);
  border: 2px solid var(--border-wood);
  box-shadow: var(--shadow-soft);
  margin-bottom: 24px;
  overflow: hidden;
  position: relative;
}

.analysis-drawer::before {
  content: '';
  position: absolute;
  top: 6px; left: 6px; right: 6px; bottom: 6px;
  border: 1px solid rgba(100, 70, 20, 0.15);
  pointer-events: none;
}

.drawer-inner {
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height .4s ease, padding .3s ease;
  position: relative;
  z-index: 1;
}

.drawer-inner.open {
  max-height: 600px;
  padding: 28px 32px;
}

.drawer-label {
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--wood);
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-wood);
}

.drawer-analysis {
  font-size: 15px;
  color: var(--ink);
  line-height: 2.2;
  font-weight: 400;
  text-align: justify;
}

/* ── YAO SECTION ── */
.yao-section-wrap { margin-top: 4px; }
.yao-section-title {
  font-size: 12px;
  letter-spacing: 0.25em;
  color: var(--wood);
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  margin-bottom: 14px;
}
.yao-list { display: flex; flex-direction: column; gap: 10px; }

.yao-item {
  border: 1px solid var(--border-wood);
  border-radius: 3px;
  overflow: hidden;
  transition: border-color .2s;
  background: var(--paper);
}
.yao-item.open { border-color: var(--wood); }

.yao-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  cursor: pointer;
  background: linear-gradient(to right, var(--paper-dark), var(--paper));
  transition: background .2s;
  user-select: none;
}
.yao-header:hover { background: var(--paper-dark); }
.yao-item.open .yao-header {
  background: linear-gradient(to right, rgba(201,162,39,0.15), rgba(201,162,39,0.05));
}

.yao-badge {
  width: 32px;
  height: 32px;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
  font-family: 'Noto Serif SC', serif;
  border: 2px solid var(--border-wood);
}
.yao-badge.yang {
  background: var(--ink-deep);
  color: var(--paper);
  border-color: var(--ink-deep);
}
.yao-badge.yin {
  background: var(--paper);
  color: var(--ink-deep);
  border-color: var(--border-wood);
}

.yao-title-wrap { flex: 1; }
.yao-pos {
  font-size: 11px;
  color: var(--wood);
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
  letter-spacing: 0.15em;
  margin-bottom: 2px;
}
.yao-ci-preview {
  font-size: 14px;
  color: var(--ink);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0.06em;
}
.yao-chevron {
  font-size: 12px;
  color: var(--wood);
  transition: transform .2s;
}
.yao-item.open .yao-chevron { transform: rotate(180deg); color: var(--seal); }

.yao-body {
  display: none;
  padding: 18px 22px;
  border-top: 1px solid var(--border-wood);
  background: rgba(255,255,255,0.5);
}
.yao-item.open .yao-body { display: block; }

.yao-sec-lbl {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--wood);
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  margin-bottom: 6px;
  margin-top: 14px;
}
.yao-sec-lbl:first-child { margin-top: 0; }
.yao-classic {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-deep);
  line-height: 2;
  letter-spacing: 0.08em;
  padding: 10px 14px;
  background: var(--paper-dark);
  border-left: 3px solid var(--wood);
  border-radius: 0 2px 2px 0;
  margin-bottom: 6px;
}
.yao-analysis {
  font-size: 14px;
  color: var(--ink);
  line-height: 2.1;
  font-weight: 400;
  text-align: justify;
}

/* ── SUMMARY ── */
.summary-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 18px;
}
.summary-item {
  padding: 16px 18px;
  background: var(--paper);
  border: 1px solid var(--border-wood);
  border-radius: 3px;
}
.summary-label {
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--wood);
  font-family: 'Noto Serif SC', serif;
  font-weight: 700;
  margin-bottom: 6px;
}
.summary-val {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.8;
  font-weight: 500;
}
.summary-full {
  padding: 22px 26px;
  background: var(--paper);
  border: 2px solid var(--border-wood);
  border-radius: 3px;
  font-size: 15px;
  color: var(--ink);
  line-height: 2.2;
  font-weight: 400;
  text-align: justify;
  position: relative;
}
.summary-full::before {
  content: '';
  position: absolute;
  top: 8px; left: 8px; right: 8px; bottom: 8px;
  border: 1px solid rgba(100, 70, 20, 0.15);
  pointer-events: none;
}

/* ── BOTTOM TABS ── */
.bottom-nav {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border-wood);
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
}
.bottom-nav::-webkit-scrollbar { display: none; }
.b-tab {
  padding: 12px 28px;
  font-size: 14px;
  color: var(--ink-light);
  cursor: pointer;
  letter-spacing: 0.15em;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: color .2s, background .2s;
  font-family: 'Noto Serif SC', serif;
  font-weight: 600;
}
.b-tab:hover { color: var(--ink); background: rgba(234,226,207,0.5); }
.b-tab.active {
  color: var(--ink-deep);
  border-bottom-color: var(--wood);
  font-weight: 700;
  background: rgba(201,162,39,0.1);
}
.b-panel { display: none; }
.b-panel.active { display: block; }

/* ── NOT YET ── */
.not-yet {
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-light);
}
.not-yet-glyph {
  font-size: 64px;
  margin-bottom: 20px;
  opacity: 0.4;
}
.not-yet p {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.1em;
}

/* ── ANIM ── */
@keyframes fadeSlide {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
.gua-hero, .analysis-drawer, .yao-item {
  animation: fadeSlide .3s ease both;
}

@media (max-width: 768px) {
  .gua-hero { grid-template-columns: 1fr; }
  .hex-panel {
    background: var(--paper-dark);
    padding: 30px 20px;
    border-right: none;
    border-bottom: 2px solid var(--border-wood);
  }
  .hex-panel::before { display: none; }
  .gua-meta-panel { padding: 26px 20px 24px; }
  .gua-watermark {
    font-size: 140px;
    right: 10px;
  }
  .gua-main-name { font-size: 56px; }
  .meta-top-row { flex-direction: column; gap: 16px; }
  .trigram-cards { justify-content: flex-start; }
  .summary-grid { grid-template-columns: 1fr; }
  .site-header { padding: 12px 16px; }
  .main { padding: 24px 12px 60px; }
  .gua-hero { box-shadow: var(--shadow-soft); }
  .gua-tags { flex-wrap: wrap; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">周易六十四卦<span>THE BOOK OF CHANGES</span></div>
  <div class="selector-wrap">
    <select class="gua-select" id="guaSelect" onchange="loadGua(this.value)"></select>
  </div>
</header>

<main class="main" id="mainContent">
  <div class="not-yet"><div class="not-yet-glyph">☰</div><p>请从上方选择卦象</p></div>
</main>

<script>
/* ═══════════════════════════════════════════════
   数据
═══════════════════════════════════════════════ */
const TRIGRAMS = {
  // lines: [初爻, 二爻, 三爻]  - 从下往上的顺序（数组索引0是最下面的初爻）
  '乾':{ lines:[1,1,1], nature:'天', de:'健', attr:'刚健' },   // ☰ 初九、九二、九三
  '兑':{ lines:[1,1,0], nature:'泽', de:'悦', attr:'喜悦' },   // ☱ 初九、九二、六三（修正：最上面是阴）
  '离':{ lines:[1,0,1], nature:'火', de:'丽', attr:'附丽' },   // ☲ 初九、六二、九三
  '震':{ lines:[1,0,0], nature:'雷', de:'动', attr:'震动' },   // ☳ 初九、六二、六三
  '巽':{ lines:[0,1,1], nature:'风', de:'入', attr:'柔顺' },   // ☴ 初六、九二、九三（修正：最下面是阴）

// 卦全名规则：上卦nature + "为" + 下卦nature（若上下相同），或 上卦nature + 下卦nature
function fullGuaName(g) {
  const up = TRIGRAMS[g.upper];
  const lo = TRIGRAMS[g.lower];
  if (!up || !lo) return g.name + '卦';
  if (g.upper === g.lower) return g.upper + '为' + up.nature;      // 乾为天、坤为地、坎为水
  return up.nature + lo.nature + g.name;                            // 水雷屯、山水蒙
}

/* ═══════════════════════════════════════════════
   辅助函数
═══════════════════════════════════════════════ */
function buildLines(g) {
  const lo = TRIGRAMS[g.lower]?.lines || [0,0,0];  // 下卦: [初, 二, 三]
  const up = TRIGRAMS[g.upper]?.lines || [0,0,0];  // 上卦: [初, 二, 三]
  // 返回六爻: [下初, 下二, 下三, 上初, 上二, 上三]
  // 也就是: [初, 二, 三, 四, 五, 上]
  return [...lo, ...up];
}

function linesSymbol(lines) {
  return lines.map(l => l?'⚊':'⚋').reverse().join('');
}

// 构建下拉
const sel = document.getElementById('guaSelect');
const optDef = document.createElement('option');
optDef.value=''; optDef.textContent='— 选择卦象 —';
sel.appendChild(optDef);
HEXAGRAMS.forEach(g => {
  const opt = document.createElement('option');
  opt.value = g.num;
  const sym = linesSymbol(buildLines(g));
  const fn = fullGuaName(g);
  opt.textContent = `${String(g.num).padStart(2,'0')}  ${sym}  ${fn} · ${g.pinyin}`;
  sel.appendChild(opt);
});

let CUR_GUA = null;
let CUR_DRAWER = null;   // 'guaci' | 'tuan' | 'daxiang' | null
let CUR_ACTIVE_YAO = -1;
let CUR_BOT_TAB = 'yaos';

function loadGua(num) {
  if (!num) return;
  CUR_GUA = HEXAGRAMS.find(g => g.num == num);
  CUR_DRAWER = null;
  CUR_ACTIVE_YAO = -1;
  CUR_BOT_TAB = 'yaos';
  render();
}

function openDrawer(key) {
  CUR_DRAWER = (CUR_DRAWER === key) ? null : key;
  renderDrawer();
}

function selectYaoFromHex(idx) {
  CUR_ACTIVE_YAO = idx;
  CUR_BOT_TAB = 'yaos';
  renderBottomPanel();
  setTimeout(() => {
    const item = document.querySelector(`.yao-item[data-yao="${idx}"]`);
    if (item) {
      if (!item.classList.contains('open')) item.classList.add('open');
      item.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
  }, 50);
}

function switchBotTab(tab) {
  CUR_BOT_TAB = tab;
  renderBottomPanel();
}

function toggleYao(idx) {
  const item = document.querySelector(`.yao-item[data-yao="${idx}"]`);
  if (item) item.classList.toggle('open');
}

function renderHexFig(g) {
  const lines = buildLines(g);

  function lineRow(i) {
    const isYang = lines[i] === 1;
    const isActive = CUR_ACTIVE_YAO === i;
    const svg = isYang ? yangSvg(isActive) : yinSvg(isActive);
    return `<div class="hex-line-row ${isActive?'active-yao':''}" onclick="selectYaoFromHex(${i})">
      <div class="hex-line-bar ${isYang?'yang':'yin'}">${svg}</div>
    </div>`;
  }

  const upLines = [5,4,3].map(i => lineRow(i)).join('');
  const loLines = [2,1,0].map(i => lineRow(i)).join('');

  return `
  <div style="display:flex;flex-direction:column;align-items:center;">
    <div class="hex-lines">${upLines}</div>
    <hr class="trig-sep">
    <div class="hex-lines">${loLines}</div>
  </div>`;
}

function renderDrawer() {
  const drawerEl = document.getElementById('analysisDrawer');
  const innerEl  = document.getElementById('drawerInner');
  if (!drawerEl || !innerEl) return;

  document.querySelectorAll('.orig-block').forEach((el,i) => {
    const keys = ['guaci','tuan','daxiang'];
    el.classList.toggle('active', keys[i] === CUR_DRAWER);
  });

  if (!CUR_DRAWER || !CUR_GUA || CUR_GUA._placeholder) {
    innerEl.classList.remove('open');
    return;
  }
  const g = CUR_GUA;
  const map = { guaci:['卦辞解析', g.guaci.explain], tuan:['彖辞解析', g.tuan.explain], daxiang:['大象解析', g.daxiang.explain] };
  const [label, text] = map[CUR_DRAWER] || ['', ''];
  innerEl.innerHTML = `<div class="drawer-label">${label}</div><div class="drawer-analysis">${text}</div>`;
  innerEl.classList.add('open');
}

        <div class="yao-body">
          <div class="yao-sec-lbl">爻辞</div>
          <div class="yao-classic">${yao.ci}</div>
          <div class="yao-sec-lbl">小象</div>
          <div class="yao-classic">${yao.xiao}</div>
          <div class="yao-sec-lbl">解析</div>
          <div class="yao-analysis">${yao.explain}</div>
        </div>
      </div>`;
    }).join('');
    content = `<div class="yao-list">${yaoHTML}</div>`;
  } else if (CUR_BOT_TAB === 'summary') {
    const s = g.summary;
    content = `
      <div class="summary-grid">
        <div class="summary-item"><div class="summary-label">核心精神</div><div class="summary-val">${s.core}</div></div>
        <div class="summary-item"><div class="summary-label">适用场景</div><div class="summary-val">${s.apply}</div></div>
        <div class="summary-item"><div class="summary-label">警示</div><div class="summary-val">${s.warn}</div></div>
        <div class="summary-item"><div class="summary-label">卦时</div><div class="summary-val">${s.season}</div></div>
      </div>
      <div class="summary-full">${s.overall}</div>`;
  }

  el.innerHTML = `
    <nav class="bottom-nav">${tabNav}</nav>
    <div class="b-panel active">${content}</div>
  `;
}

/* ═══════════════════════════════════════════════
   主渲染
═══════════════════════════════════════════════ */
function render() {
  const g = CUR_GUA;
  if (!g) return;
  const lo = TRIGRAMS[g.lower];
  const up = TRIGRAMS[g.upper];
  const fn = fullGuaName(g);

  const html = `
    <div class="gua-hero">
      <div class="corner-decoration top-left"></div>
      <div class="corner-decoration top-right"></div>
      <div class="corner-decoration bottom-left"></div>
      <div class="corner-decoration bottom-right"></div>

      <div class="hex-panel">
        ${renderHexFig(g)}
        <div class="hex-panel-num">第 ${g.num} 卦</div>
      </div>

      <div class="gua-meta-panel">
        <div class="gua-watermark">${g.name}</div>

        <div class="meta-top-row">
          <div class="gua-name-section">
            <div class="gua-main-name">${g.name}</div>
            <div class="gua-name-sub">
              <div class="gua-pinyin">${g.pinyin.toUpperCase()}</div>
              <div class="gua-fullname">${fn}</div>
            </div>
          </div>

          <div class="trigram-cards">
            <div class="trig-mini-card">
              <div class="trig-mini-role">外卦</div>
              <div class="trig-mini-name">${g.upper}</div>
              ${up ? `<div class="trig-mini-attr">${up.nature} · ${up.de}</div>` : ''}
            </div>
            <div class="trig-mini-card">
              <div class="trig-mini-role">内卦</div>
              <div class="trig-mini-name">${g.lower}</div>
              ${lo ? `<div class="trig-mini-attr">${lo.nature} · ${lo.de}</div>` : ''}
            </div>
          </div>
        </div>

        <div class="gua-tags">
          <span class="tag"><b>象</b> ${g.xiang}</span>
          <span class="tag"><b>德</b> ${g.de.length > 14 ? g.de.slice(0,14)+'…' : g.de}</span>
          <span class="tag"><b>时</b> ${g.shi}</span>
        </div>

        <div class="orig-blocks">
          ${renderOrigBlocks(g)}
        </div>
      </div>
    </div>

    <div class="analysis-drawer" id="analysisDrawer">
      <div class="drawer-inner" id="drawerInner"></div>
    </div>
    <div id="bottomPanel"></div>
  `;

  document.getElementById('mainContent').innerHTML = html;
  renderBottomPanel();
  if (CUR_DRAWER) renderDrawer();
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('guaSelect').value = '1';
  loadGua(1);
});
</script>
</body>
</html>
